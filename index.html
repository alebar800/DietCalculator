    function isSafeFood(food, userAllergens = []) {
      if (!food || !food.allergens) return true;
      return !food.allergens.some(a => userAllergens.includes(a));
    }

    function generateSmartDiet(targetKcal, userAllergens = [], quizPrefs = null, variantIndex = 0) {
      const round5 = (val) => Math.max(15, Math.round(val / 5) * 5);
      const safeFoods = FOODS.filter(f => isSafeFood(f, userAllergens));

      const pickFood = (filterFn, fallbackIds) => {
        const matches = safeFoods.filter(filterFn);
        if (matches.length > 0) {
          return matches[variantIndex % matches.length];
        }
        for (let id of fallbackIds) {
          const f = safeFoods.find(item => item.id === id);
          if (f) return f;
        }
        return safeFoods[0] || FOODS[0];
      };

      const wantSweetBreakfast = quizPrefs ? quizPrefs.breakfast === 'sweet' : (variantIndex % 2 === 0);
      const bfMain = pickFood(
        f => f.cat === 'breakfast' && f.tags.includes(wantSweetBreakfast ? 'sweet' : 'savory'),
        [1, 4, 5, 13]
      );
      const bfExtra = pickFood(f => f.cat === 'snack' && f.tags.includes('fruit'), [53, 54]);

      const lunchProteinTag = quizPrefs?.lunchProtein || (['poultry', 'meat', 'fish'][variantIndex % 3]);
      const lunchSideTag = quizPrefs?.lunchSide || (['potato', 'buckwheat', 'rice', 'pasta'][variantIndex % 4]);

      let lunchItems = [];
      if (lunchProteinTag === 'poultry' && lunchSideTag === 'potato' && isSafeFood(FOODS.find(f => f.id === 14), userAllergens)) {
        const stew = FOODS.find(f => f.id === 14);
        const salad = pickFood(f => f.id === 49, [48, 49]);
        lunchItems = [
          { meal: 'lunch', food: stew, share: 0.31 },
          { meal: 'lunch', food: salad, share: 0.06 }
        ];
      } else {
        const lProt = pickFood(f => f.cat === 'main' && f.tags.includes(lunchProteinTag), [13, 15, 21, 16]);
        const lSide = pickFood(f => f.cat === 'side' && f.tags.includes(lunchSideTag), [40, 42, 44]);
        lunchItems = [
          { meal: 'lunch', food: lProt, share: 0.19 },
          { meal: 'lunch', food: lSide, share: 0.18 }
        ];
      }

      const dinnerStyle = quizPrefs?.dinner || (variantIndex % 2 === 0 ? 'light' : 'home');
      const dProt = pickFood(
        f => (f.cat === 'main' || f.cat === 'combo') && f.tags.includes(dinnerStyle) && f.id !== lunchItems[0]?.food?.id,
        [16, 20, 14, 21]
      );
      const dSide = pickFood(f => f.cat === 'side' && (dinnerStyle === 'light' ? f.tags.includes('veggies') : true), [48, 44, 40]);

      const snackMain = pickFood(f => f.cat === 'snack' && (f.tags.includes('curd') || f.tags.includes('light')), [50, 51, 52, 59]);
      const snackNuts = pickFood(f => f.cat === 'snack' && (f.tags.includes('nuts') || f.tags.includes('fruit')), [56, 53, 54]);

      const rawPlan = [
        { meal: 'breakfast', food: bfMain, share: 0.21 },
        { meal: 'breakfast', food: bfExtra, share: 0.07 },
        ...lunchItems,
        { meal: 'dinner', food: dProt, share: 0.16 },
        { meal: 'dinner', food: dSide, share: 0.09 },
        { meal: 'snack', food: snackMain, share: 0.06 },
        { meal: 'snack', food: snackNuts, share: 0.04 }
      ];

      const generatedLog = rawPlan.map((item, idx) => {
        const desiredKcal = targetKcal * item.share;
        const grams = round5((desiredKcal / item.food.kcal) * 100);
        return {
          id: Date.now() + idx,
          meal: item.meal,
          foodId: item.food.id,
          grams
        };
      });

      const allergenNote = userAllergens.length > 0
        ? ` (учтены исключения: ${userAllergens.length})`
        : '';

      const note = quizPrefs
        ? `Персональное меню по твоим вечерним пожеланиям составлено${allergenNote}!`
        : `Сбалансированный рацион из доступных блюд подобран${allergenNote}.`;

      return { log: generatedLog, note };
    }

    function evaluateDayStatus(doneCount, missedCount, completedKcal, targetKcal, manualOverride) {
      if (manualOverride) return manualOverride;
      const ratio = targetKcal > 0 ? completedKcal / targetKcal : 0;
      if (doneCount === 4 || (ratio >= 0.85 && doneCount >= 3 && missedCount === 0)) return 'green';
      if (doneCount >= 1 || ratio >= 0.25) return 'yellow';
      if (missedCount >= 1 && doneCount === 0) return 'red';
      return 'none';
    }

    // Единый постоянный ключ хранения, который не сбрасывается между версиями
    const STORAGE_KEY = 'diet_app_master_state';

    function loadMasterState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return null;
    }

      const [age, setAge] = useState(() => initialSaved?.age || 20);
      const [weight, setWeight] = useState(() => initialSaved?.weight || 70);
      const [height, setHeight] = useState(() => initialSaved?.height || 175);
      const [activity, setActivity] = useState(() => initialSaved?.
